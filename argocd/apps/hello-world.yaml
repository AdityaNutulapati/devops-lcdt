apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-world
  namespace: argocd
spec:
  project: lcdt

  source:
    repoURL: https://github.com/AdityaNutulapati/devops-lcdt.git
    targetRevision: main
    path: helm/hello-world
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
  
  # Show all child resources (Pods, ReplicaSets, etc)
  info:
    - name: 'Resource Tracking'
      value: 'Enabled'
