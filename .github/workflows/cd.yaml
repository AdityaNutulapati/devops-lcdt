name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

env:
  AWS_REGION: ap-south-2
  CLUSTER_NAME: aditya-eks-cluster
  ECR_REPOSITORY: lcdt/hello-world

permissions:
  contents: read
  id-token: write

jobs:
  ############################################################################
  # Sync & Verify
  ############################################################################
  sync-verify:
    name: Sync & Verify
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug - Check AWS_ROLE_ARN secret
        run: |
          if [ -z "${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "ERROR: AWS_ROLE_ARN secret is not set!"
            exit 1
          fi
          echo "AWS_ROLE_ARN is set (length: ${#AWS_ROLE_ARN})"
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-CD-${{ github.run_id }}
          role-duration-seconds: 3600

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.CLUSTER_NAME }}
          
          echo "=== Verifying kubectl access ==="
          kubectl version --client
          kubectl cluster-info
          kubectl auth can-i get pods --all-namespaces

      - name: Sync all ArgoCD applications
        run: |
          echo "=== Triggering hard refresh for all apps ==="
          kubectl annotate application monitoring -n argocd argocd.argoproj.io/refresh=hard --overwrite
          kubectl annotate application hello-world -n argocd argocd.argoproj.io/refresh=hard --overwrite
          
          echo "=== Waiting for ArgoCD sync ==="
          sleep 10
          
          echo "=== Restarting hello-world deployment to pull latest image ==="
          kubectl rollout restart deployment/hello-world -n default

      - name: Wait for hello-world rollout
        run: |
          kubectl rollout status deployment/hello-world \
            --namespace default --timeout=180s

      - name: Verify monitoring stack
        run: |
          echo "=== Checking monitoring pods ==="
          kubectl get pods -n monitoring -l app.kubernetes.io/name=prometheus
          kubectl get pods -n monitoring -l app.kubernetes.io/name=grafana

      - name: Print deployment status
        if: always()
        run: |
          echo "=== ArgoCD Applications ==="
          kubectl get applications -n argocd -o wide
          echo ""
          echo "=== Hello-World Deployment ==="
          kubectl get deployment hello-world -n default -o wide
          kubectl get pods -n default -l app.kubernetes.io/name=hello-world -o wide
          echo ""
          echo "=== New Resources (PDB, NetworkPolicy) ==="
          kubectl get pdb -n default
          kubectl get networkpolicy -n default
          echo ""
          echo "=== Monitoring Stack ==="
          kubectl get pods -n monitoring -l app.kubernetes.io/part-of=kube-prometheus-stack
          echo ""
          echo "=== Services ==="
          kubectl get svc -n default -l app.kubernetes.io/name=hello-world
          kubectl get svc -n monitoring -l app.kubernetes.io/name=grafana
