name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

env:
  AWS_REGION: ap-south-2
  CLUSTER_NAME: aditya-eks-cluster
  ECR_REPOSITORY: lcdt/hello-world

permissions:
  contents: read
  id-token: write

jobs:
  ############################################################################
  # Sync & Verify
  ############################################################################
  sync-verify:
    name: Sync & Verify
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.CLUSTER_NAME }}

      - name: Sync hello-world via ArgoCD
        run: |
          IMAGE_TAG=${{ github.sha }}
          kubectl patch application hello-world -n argocd --type merge \
            -p "{\"spec\":{\"source\":{\"helm\":{\"parameters\":[{\"name\":\"image.tag\",\"value\":\"${IMAGE_TAG}\"}]}}}}"
          kubectl annotate application hello-world -n argocd argocd.argoproj.io/refresh=hard --overwrite

      - name: Wait for rollout
        run: |
          sleep 30
          kubectl rollout status deployment/hello-world \
            --namespace default --timeout=120s

      - name: Print status
        if: always()
        run: |
          echo "=== ArgoCD Applications ==="
          kubectl get applications -n argocd
          echo ""
          echo "=== Pods ==="
          kubectl get pods -n default -l app.kubernetes.io/name=hello-world -o wide
          echo ""
          echo "=== Services ==="
          kubectl get svc -n default -l app.kubernetes.io/name=hello-world
