name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

env:
  AWS_REGION: ap-south-2
  CLUSTER_NAME: aditya-eks-cluster
  ECR_REPOSITORY: lcdt/hello-world

permissions:
  contents: read
  id-token: write

jobs:
  ############################################################################
  # Bootstrap ArgoCD (only needed on first run or updates)
  ############################################################################
  bootstrap-argocd:
    name: Bootstrap ArgoCD
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: arn:aws:iam::515230700333:role/lcdt-admin
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.CLUSTER_NAME }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.0

      - name: Install/Upgrade ArgoCD
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update
          helm upgrade --install argocd argo/argo-cd \
            --namespace argocd --create-namespace \
            -f argocd/install-values.yaml \
            --wait --timeout 5m

      - name: Apply ArgoCD Project
        run: kubectl apply -f argocd/project.yaml

      - name: Apply ArgoCD Applications
        run: |
          kubectl apply -f argocd/apps/monitoring.yaml
          kubectl apply -f argocd/apps/hello-world.yaml

      - name: Apply custom alert rules
        run: |
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f monitoring/alerts/custom-alerts.yaml -n monitoring

  ############################################################################
  # Sync & Verify
  ############################################################################
  sync-verify:
    name: Sync & Verify
    runs-on: ubuntu-latest
    needs: bootstrap-argocd
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: arn:aws:iam::515230700333:role/lcdt-admin
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.CLUSTER_NAME }}

      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o argocd-linux-amd64 https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd-linux-amd64
          sudo mv argocd-linux-amd64 /usr/local/bin/argocd

      - name: Login to ArgoCD
        run: |
          ARGOCD_PWD=$(kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d)
          kubectl port-forward svc/argocd-server -n argocd 8080:443 &
          sleep 3
          argocd login localhost:8080 --username admin --password "${ARGOCD_PWD}" --insecure

      - name: Trigger sync for hello-world
        run: |
          IMAGE_TAG=$(git rev-parse --short HEAD)
          argocd app set hello-world --helm-set image.tag=${IMAGE_TAG}
          argocd app sync hello-world --force --prune
          argocd app wait hello-world --timeout 300

      - name: Trigger sync for monitoring
        run: |
          argocd app sync monitoring --force --prune
          argocd app wait monitoring --timeout 600

      - name: Verify deployments
        run: |
          kubectl rollout status deployment -l app.kubernetes.io/name=hello-world \
            --namespace default --timeout=300s

      - name: Print status
        if: always()
        run: |
          echo "=== ArgoCD Applications ==="
          argocd app list 2>/dev/null || kubectl get applications -n argocd
          echo ""
          echo "=== Pods ==="
          kubectl get pods -n default -l app.kubernetes.io/name=hello-world -o wide
          echo ""
          echo "=== Services ==="
          kubectl get svc -n default -l app.kubernetes.io/name=hello-world
          echo ""
          echo "=== HPA ==="
          kubectl get hpa -n default
