# Create this secret BEFORE deploying the monitoring stack:
#   kubectl create secret generic grafana-admin-credentials \
#     --namespace monitoring \
#     --from-literal=admin-user=admin \
#     --from-literal=admin-password='<YOUR_SECURE_PASSWORD>'
#
# Or apply this manifest after replacing the base64-encoded values:
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
type: Opaque
data:
  admin-user: YWRtaW4=
  admin-password: REPLACE_WITH_BASE64_ENCODED_PASSWORD
